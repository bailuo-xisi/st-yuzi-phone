name: Auto Sync
on:
  # 北京时间每天早上8点（UTC 0点）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发，方便调试
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Sync and Merge Upstream
        uses: aormsby/Fork-Sync-With-Upstream-Action@v3
        with:
          upstream_sync_repo: yuzi83/st-yuzi-phone
          upstream_sync_branch: main
          target_sync_branch: main
          test_mode: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
